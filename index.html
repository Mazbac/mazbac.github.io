<!DOCTYPE html>

  <meta name="theme-color" content="#0a0910">
  <script>
    (() => {
      let saved;
      try { saved = localStorage.getItem('portfolio-theme'); } catch (_) { /* storage may be unavailable */ }
      const media = window.matchMedia('(prefers-color-scheme: light)');
      const theme = saved === 'light' || saved === 'dark' ? saved : media.matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f6f4fb' : '#0a0910';
    })();
  </script>
  <meta property="og:title" content="Mertcan Özbek — ICT Professional &amp; ServiceNow Engineer">
  <meta property="og:description" content="Portfolio van Mertcan Özbek: ICT professional met ervaring in enterprise Microsoft 365, ServiceNow en ITIL.">
